# ============================================================
#  像素 Sprite 流水线配置  (Mac / Apple Silicon 版)
#  所有参数集中在这里。改这里,不用改脚本。
# ============================================================

[project]
# 你的 Godot 项目根目录(包含 project.godot)。第④段导入需要它。
# 留空则第④段自动跳过(只跑 生成→后处理→打包)。
godot_project_path = "/Users/patricksapple/Documents/Claude/Projects/游戏开发/game"

# Godot 可执行文件。Mac 上从官网下的是一个 .app,真正的二进制在里面:
#   /Applications/Godot.app/Contents/MacOS/Godot
# 如果你用 brew 装了 godot 并在 PATH 里,填 "godot" 即可。
godot_binary = "/Applications/Godot.app/Contents/MacOS/Godot"


[pipeline]
work_dir   = "."               # 流水线根目录(raw/ processed/ packed/ 都在它下面)
target_size = 32               # 目标像素边长(32 或 16)。每个动画帧会被规整成 N×N。
palette_colors = 32            # 颜色量化数量(8/16/32/64);设 0 表示不量化。
transparent_bg = true          # 是否把接近纯色的背景抠成透明。
bg_tolerance = 16              # 背景去除容差(0-255),越大去得越狠。
autocrop = true                # 规整前先自动裁掉四周空白,让角色居中占满。


[generation]
# 生成层后端: manual | drawthings | comfyui | pixellab
#   manual    —— 你自己把图丢进 raw/<角色>/<动作>/,脚本只校验(零依赖,推荐起步)
#   drawthings—— 调 Draw Things 的 API Server(Mac 首选)
#   comfyui   —— 调 ComfyUI 的 /prompt 接口
#   pixellab  —— 占位;PixelLab 更推荐走 MCP,见 README
backend = "manual"
fps = 8                        # 动画帧率,写进 frames.json 供 Godot 用。

# 要生成/处理的角色与动作清单(manual 模式下用于校验目录是否齐全)。
# 每个动作的帧数由 raw 目录里实际图片数量决定。
[generation.characters.knight]
actions = ["idle", "walk", "attack"]


# ---------- Draw Things 后端(Mac 首选) ----------
[generation.drawthings]
# 在 Draw Things App 内打开 Settings → Advanced → API Server,启动后会显示地址/端口。
# 把这里改成它显示的地址。
api_url = "http://127.0.0.1:7860"
model   = "sd_xl_base_1.0"     # 已在 Draw Things 里导入的 SDXL 模型名
loras   = ["pixel-art-xl:1.2", "lcm-lora-sdxl:1.0"]
steps   = 8
cfg     = 1.5
sampler = "LCM"
width   = 512
height  = 512
# 正/负提示词模板;{subject} 会被下面每个动作的描述替换。
positive = "pixel, {subject}, side view, full body, simple background, game asset"
negative = "3d render, realistic, blurry, photo"


# ---------- ComfyUI 后端 ----------
[generation.comfyui]
api_url = "http://127.0.0.1:8188"
# 在 ComfyUI 里调好 workflow 后用 "Save (API Format)" 导出的 json。
workflow_api = "pixel_workflow_api.json"


# ---------- PixelLab 后端(占位) ----------
[generation.pixellab]
# PixelLab 更适合走 MCP(见 README「vibe coding」一节)。
# 若要走 REST,把 key 放进环境变量并填名字。
api_key_env = "PIXELLAB_API_KEY"
